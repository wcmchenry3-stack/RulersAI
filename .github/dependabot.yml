version: 2
updates:
  # SHA-pinned actions are still tracked: Dependabot resolves the tag behind
  # the SHA and opens a PR when a newer version is released.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # CVE fixes get their own PR so they are never held up behind a routine batch.
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      # Minor/patch action bumps batch into one PR. Majors still open
      # individually — an action major can change inputs or runtime.
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
